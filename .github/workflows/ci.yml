name: tests

# Registered as ci.yml rather than tests.yml deliberately. Push events
# stopped creating runs for the previous registration after the default
# branch was renamed; disabling/re-enabling and re-saving that workflow did
# not restore it, and a push to a brand-new branch listed in its triggers
# was ignored too, so the fault was the registration rather than the file.
# A new filename forces a fresh workflow id. See docs/KNOWN_ISSUES.md GSL-2.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range from pyproject (>=3.10,<3.13). 3.13 is excluded
        # deliberately: MediaPipe 0.10.x has no wheels for it.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        # Not optional: the test fixtures are generated by FFmpeg at test time
        # rather than committed, so without it most of the suite would skip
        # and CI would pass while testing almost nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install system libraries for OpenCV
        # The non-headless OpenCV wheel links against libGL, which the GitHub
        # runners do not ship.
        run: sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install project
        # One command, matching the README. Installing mediapipe separately
        # would resolve opencv to 5.x and numpy to 2.x and break the stack.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pose]"

      - name: Check dependency resolution
        # A passing test suite on a broken dependency set is not a green
        # build; this is what catches the numpy-2 regression early.
        run: pip check

      - name: Show diagnostics
        run: python -m golf_lab.diagnostics

      - name: Run tests
        # Pose integration tests skip here by design: no model is downloaded
        # in CI, because a green build should never depend on a network fetch
        # from a third party.
        run: pytest -q -rs
